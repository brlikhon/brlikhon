      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="55%" stop-color="#0C1425"/>
      <stop offset="100%" stop-color="#080F1D"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="18%" cy="24%" r="55%">
