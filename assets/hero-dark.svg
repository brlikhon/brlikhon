  <rect x="2" y="2" width="1196" height="344" rx="22" fill="url(#glowCyan)"/>
  <rect x="2" y="2" width="1196" height="344" rx="22" fill="url(#glowIndigo)"/>
  <rect x="290" y="2" width="360" height="2.5" rx="1.25" fill="url(#ringGrad)"/>

