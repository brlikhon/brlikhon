  <rect x="2" y="2" width="1196" height="344" rx="22" fill="url(#glowSkyLight)"/>
  <rect x="2" y="2" width="1196" height="344" rx="22" fill="url(#glowIndigoLight)"/>
  <rect x="290" y="2" width="360" height="3" rx="1.5" fill="url(#ringGradLight)"/>

