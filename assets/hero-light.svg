<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" width="1200" height="348" role="img" aria-labelledby="heroTitleLight heroDescLight">
  <title id="heroTitleLight">Md Bazlur Rahman Likhon (@brlikhon) — AI Engineer, Senior AI Engineer, Enterprise Agent Engineer &amp; Senior Cloud and AI Engineer</title>
  <desc id="heroDescLight">Global portfolio banner for Md Bazlur Rahman Likhon (@brlikhon), AI Engineer, Senior AI Engineer, Enterprise Agent Engineer (Gemini Enterprise Agent Platform, Google Agentspace, ADK &amp; MCP), Senior Cloud and AI Engineer, and Head of AI Engineering at Upstra Communications Limited (Google Cloud Premier Partner).</desc>
  <defs>
